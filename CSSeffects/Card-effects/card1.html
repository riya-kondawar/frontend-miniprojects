<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card 1</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet" />

    <style>
        body,
        html {
            height: 100%;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            background: #efecff;
            background-size: 16px 16px;
            font-family: "Euclid Circular A", "Poppins";
        }

        .card {
            display: flex;
            align-items: center;
            width: 75vw;
            max-width: 650px;
            padding: 50px 30px 50px 20px;
            background: #ffffff;
            border-radius: 24px;
        }

        .card img {
            max-width: 280px;
            width: 28vw;
            height: 300px;
            object-fit: cover;
            margin-left: -60px;
            margin-right: 30px;
            border-radius: inherit;
            box-shadow: 0 60px 40px rgb(0 0 0 / 8%);
        }

        .card h2 {
            font-size: 22px;
            margin-right: 30px;
        }

        .card h3 {
            font-size: 16px;
            font-weight: 400;
            color: rgb(0 0 0 / 90%);
        }

        .card p {
            font-size: 14px;
            font-weight: 400;
            color: rgb(0 0 0 / 70%);
            margin-bottom: 24px;
        }

        .card button {
            border: 0;
            background: linear-gradient(90deg, #5448de, #5448de);
            color: #f8f8f8;
            font-family: inherit;
            padding: 16px 26px;
            font-size: 16px;
            border-radius: 40px;
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="image.jpeg" alt="img"/>
        <div>
            <h2>Invest in Valby's sparkling new construction</h2>
            <h3>Type: Residential rental</h3>
            <p>
                Soon you can invest in Sid Harman's new attractive property, set in
                the heart of Athens.
            </p>
            <button>Show the property project</button>
        </div>
    </div>
</body>

</html>
