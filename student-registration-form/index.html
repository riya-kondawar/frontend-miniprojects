<!-- Student Registration form HTML -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <title>Registration Form</title>

    <style>
        /* registration form css */
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: url(https://images.pexels.com/photos/1103970/pexels-photo-1103970.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1) no-repeat;
            background-position: center;
            background-size: cover;
            /* color: #f5f6f7; */
            color: #0a0a23;
            font-family: Tahoma;
            font-size: 16px;
        }

        h1,
        p {
            margin: 1em auto;
            text-align: center;
        }

        form {
            width: 60vw;
            max-width: 500px;
            min-width: 300px;
            margin: 0 auto;
            padding-bottom: 2em;
        }

        fieldset {
            border: none;
            padding: 2rem 0;
            border-bottom: 3px solid #3b3b4f;
        }

        label {
            display: block;
            margin: 0.5rem 0;
        }

        input {
            margin: 10px 0 0 0;
            width: 100%;
            min-height: 2em;
            background-color: #0a0a23;
            border: 1px solid #0a0a23;
            color: #ffffff;
            border-radius: 10px;
        }

        input[type="submit"],
        input[type="reset"] {
            display: block;
            width: 60%;
            margin: 1em auto;
            height: 2em;
            font-size: 1.1rem;
            background-color: #3b3b4f;
            border-color: white;
            min-width: 300px;
        }
    </style>
</head>

<body>
    <h1>Student Registration Form</h1>
    <p>Please fill out this form with the required information</p>
    <form id="registrationForm" action="#">
        <div class="form">
            <!-- Username -->
            <label for="username">Enter Your Username:
                <input id="username" name="username" type="text" required />
            </label>

            <!-- Email -->
            <label for="email">Enter Your Email:
                <input id="email" name="email" type="email" required />
            </label>

            <!-- Phone Number -->
            <label for="phone">Enter Your Contact No.:
                <!-- <input id="phone" name="phone" type="tel" required /> -->
                <input id="phone" name="phone" type="tel" pattern="\d{10}" required title="Please enter exactly 10 digits." />
            </label>

            <!-- Password -->
            <label for="new-password">Create a New Password:
                <input id="new-password" name="new-password" type="password" required />
            </label>

            <!-- Confirm Password -->
            <label for="confirm-password">Confirm Password:
                <input id="confirm-password" name="confirm-password" type="password" required />
            </label>

        </div>
        <input class="button" type="submit" value="Submit" />
        <input class="button" type="reset" value="Reset" />
        <div id="errorMessages" style="color: red; text-align: center; margin-top: 10px;"></div>
    </form>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', function (event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('new-password').value.trim();
            const confirmPassword = document.getElementById('confirm-password').value.trim();
            const errorMessages = [];

            // Validation for empty fields and spaces
            if (!username) errorMessages.push("Username is required.");
            if (!email) errorMessages.push("Email is required.");
            if (!phone) errorMessages.push("Phone number is required.");
            if (!password) errorMessages.push("Password is required.");
            if (!confirmPassword) errorMessages.push("Confirm Password is required.");

            // Phone number validation (must be 10 digits)
            if (!/^\d{10}$/.test(phone)) {
                errorMessages.push("Phone number must be 10 digits and contain only numeric values.");
            }

            // Password validation (at least 7 characters, 1 capital letter, 1 digit, 1 special character)
            if (!/^(?=.*[A-Z])(?=.*\d)(?=.*[&$#@]).{7,}$/.test(password)) {
                errorMessages.push("Password must be at least 7 characters long, contain at least one capital letter, one digit, and one special character (&,$,#,@).");
            }

            // Confirm password validation
            if (password !== confirmPassword) {
                errorMessages.push("Password and Confirm Password must match.");
            }

            // Email validation
            if (!/^[A-Za-z]+@[A-Za-z]{3,}\.[A-Za-z]{2,3}$/.test(email)) {
                errorMessages.push("Email must contain @, ., with appropriate format.");
            }

            // Display error messages or success message
            const errorDiv = document.getElementById('errorMessages');
            errorDiv.innerHTML = '';

            if (errorMessages.length > 0) {
                errorDiv.innerHTML = errorMessages.join('<br>');
            } else {
                alert("Registration successful!");
                // e.g., document.getElementById('registrationForm').submit();
            }
        });

        // Alert on reset button click
        document.getElementById('registrationForm').addEventListener('reset', function () {
            alert("You have reset the form.");
        });
    </script>
</body>

</html>
